# Example nginx server block for serving the Unisole Admin panel on EC2
# alongside the engine (which already uses uni.engine.unisole.org).
#
# Usage:
#   1. Create an A record admin.unisole.org -> <EC2 public IP> in your DNS.
#   2. Install the admin container:  docker compose up --build -d   (listens on 5173)
#   3. Place this file at /etc/nginx/conf.d/admin.unisole.org.conf
#   4. Run certbot:                  sudo certbot --nginx -d admin.unisole.org
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# The browser then talks directly to the engine API (CORS is already allow-all).
# Build the image with VITE_API_BASE_URL set so the panel defaults to the
# public engine URL:  docker compose build --build-arg ...  (or export it).

server {
    listen 80;
    server_name admin.unisole.org;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
