# Example nginx server block for serving the Unisole Admin panel on EC2
# behind the same origin as the engine API (engine stays internal).
#
# Usage:
#   1. Create an A record uni.admin.unisole.org -> <EC2 public IP> in your DNS.
#   2. Install the admin container:  docker compose up --build -d   (listens on 5173)
#   3. Place this file at /etc/nginx/conf.d/uni.admin.unisole.org.conf
#   4. Run certbot:                  sudo certbot --nginx -d uni.admin.unisole.org
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# The panel is served on this domain AND its API calls (/api/*, /health) are
# reverse-proxied to the engine on 127.0.0.1:3000, so only this one domain is
# public and the engine's port 3000 is never exposed to the internet.
# Build the image with VITE_API_BASE_URL=https://uni.admin.unisole.org so the
# panel defaults to this origin.

server {
    listen 80;
    server_name uni.admin.unisole.org;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
